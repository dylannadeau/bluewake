[project]
name = "bluewake-backend"
version = "0.1.0"
description = "Maritime sanctions/compliance screening — IMO-keyed vessel risk lookup and audit-ready screening reports"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "geoalchemy2>=0.15",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "websockets>=12.0",         # aisstream.io live feed
    "weasyprint>=62",           # PDF report rendering
    "jinja2>=3.1",              # report templates
    "apscheduler>=3.10",        # phase 4: scheduled re-screening
    "email-validator>=2.0",     # pydantic EmailStr
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
