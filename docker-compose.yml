services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: bluewake
      POSTGRES_PASSWORD: bluewake
      POSTGRES_DB: bluewake
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bluewake"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://bluewake:bluewake@db:5432/bluewake
    ports:
      - "8000:8000"
    volumes:
      - reports:/data/reports
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  reports:
